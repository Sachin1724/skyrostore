# Production stack for one VPS. The database is Supabase, so there is no
# Postgres here. Local development uses docker-compose.dev.yml instead.
#
#   1. Fill apps/backend/.env, apps/storefront/.env, apps/admin/.env
#      and the build values in ./.env (see deploy/README.md).
#   2. docker compose build && docker compose up -d
#   3. First deploy or new migrations: docker compose run --rm -e RUN_MIGRATIONS=1 backend
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on: [redis]
    env_file: apps/backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    volumes:
      # Admin-uploaded images (Medusa local file provider) survive rebuilds.
      - uploads:/repo/apps/backend/.medusa/server/static

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PUBLISHABLE_KEY}
        NEXT_PUBLIC_REGION_ID: ${REGION_ID}
        NEXT_PUBLIC_SALES_CHANNEL_ID: ${SALES_CHANNEL_ID}
        NEXT_PUBLIC_SITE_URL: ${STOREFRONT_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    restart: unless-stopped
    depends_on: [backend]
    env_file: apps/storefront/.env

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${ADMIN_URL}
        NEXT_PUBLIC_SALES_CHANNEL_ID: ${SALES_CHANNEL_ID}
    restart: unless-stopped
    depends_on: [backend]
    env_file: apps/admin/.env

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [storefront, admin, backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/skyrostore.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/acme
    # Renews twice a day; nginx picks new certificates up on its next reload.
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done"]

volumes:
  redis_data:
  uploads:
  certs:
  acme:
