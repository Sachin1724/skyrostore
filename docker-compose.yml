services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyrostore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      - postgres
      - redis
    env_file: .env
    ports:
      - "9000:9000"

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    depends_on:
      - backend
    env_file: .env
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    depends_on:
      - backend
    env_file: .env
    ports:
      - "3001:3001"

volumes:
  postgres_data:
